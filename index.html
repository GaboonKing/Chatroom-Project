<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Chatroom V1</title>
        <style>
            body {margin: 0; padding-bottom: 3rem; font-family: -apply-system, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;}

            #form {background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
            #input{border: none; padding: 0 1rem; flex-grow: 1; }
            #input:focus {outline: none;}
            #form > button {background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

            #messages { list-style-type: none; margin: 0; padding: 0; }
            #messages > li { padding: 0.5rem 1rem; }
            #messages > li:nth-child(odd) { background: #efefef; }

            #error{color: red;}
        </style>
    </head>
    <body>
        <div id="username_screen">
            <h1>Enter a username:</h1>
            <form id="username-form">
                <input id="username-input" type="text" required/>
                <button type="submit">Join Chatroom</button>
                <p id="error" style="display: none">Username already taken.</p>
            </form>
        </div>

        <div id="message_stream" style="display: none"> 
            <ul id="messages"></ul>
            <form id="form" action="">
                <input id="input" autocomplete="off" /><button>Send</button>
            </form>
        </div>


        <script src="/socket.io/socket.io.js"></script>
        <script>
            var socket = io();

            var usernameScreen = document.getElementById('username_screen');
            var messageScreen = document.getElementById('message_stream');
            var errorMsg = document.getElementById('error');

            var u_form = document.getElementById('username-form');
            var u_input = document.getElementById('username-input')
            
            var form = document.getElementById('form');
            var input = document.getElementById('input');
            var messages = document.getElementById('messages');

            u_form.addEventListener('submit', function(e){
            
                e.preventDefault();
                const username = u_input.value.trim();
                if(username === ""){
                    return
                }
                socket.emit('set username', username);
                
            })

            form.addEventListener('submit', function(e){
                e.preventDefault();
                if(input.value){
                    socket.emit('chat message', input.value);
                    input.value = '';
                }
            });
            socket.on('username accepted', () =>{
                usernameScreen.style.display = "none";
                messageScreen.style.display  = "block";
            })
            socket.on('username taken', () => {
                errorMsg.style.display = "block";
            })

            socket.on('chat message', function(data){
                var item = document.createElement('li');
                item.textContent = data.username + ": " + data.message;
                messages.appendChild(item);
                window.scrollTo(0, document.body.scrollHeight);
            });
            socket.on('new connection', function(name){
                var item = document.createElement('li');
                var em = document.createElement('em');
                em.textContent = `${name} has connected.`;
                item.appendChild(em);
                item.style.textAlign = 'center';
                messages.appendChild(item);
                window.scrollTo(0, document.body.scrollHeight);
            });
        </script>
    </body>
</html>
